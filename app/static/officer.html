<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Facilities queue · CityU</title><script src="https://cdn.tailwindcss.com"></script><script src="/static/tracker.js" defer></script><style>body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}input:focus,select:focus,textarea:focus{outline:2px solid #b91c1c;outline-offset:1px}</style></head>
<body class="min-h-screen bg-[#f3f4f6] text-slate-900 antialiased"><main class="mx-auto max-w-4xl px-4 py-5 sm:px-6 sm:py-8">
<header class="rounded-3xl bg-slate-900 p-5 text-white shadow-lg sm:p-7"><div class="flex flex-col gap-5 sm:flex-row sm:items-end sm:justify-between"><div><a href="/" class="text-xs font-medium text-white/50 hover:text-white">CityU Facilities</a><div class="mt-3 flex items-center gap-2"><span class="h-2 w-2 rounded-full bg-emerald-400"></span><span class="text-xs font-semibold uppercase tracking-[.16em] text-white/60">Officer workspace</span></div><h1 class="mt-1 text-2xl font-bold tracking-tight">YKM 4/F Concourse</h1><p class="mt-1 text-sm text-white/60">Review, assign and close facility reports.</p></div><div class="w-full sm:w-64"><label for="token" class="mb-1.5 block text-xs font-medium text-white/60">Officer access token</label><input id="token" type="password" autocomplete="current-password" placeholder="Enter access token" class="w-full rounded-xl border border-white/10 bg-white/10 px-3.5 py-3 text-sm text-white placeholder:text-white/35"><button type="button" onclick="openDashboard()" class="mt-2 w-full rounded-xl border border-white/20 px-3 py-2 text-xs font-semibold text-white/75 hover:bg-white/10">Operations dashboard →</button></div></div></header>
<div class="mt-5 flex gap-2 overflow-x-auto rounded-2xl border border-slate-200 bg-white p-1.5 shadow-sm" role="tablist"><button data-status="NEW" onclick="loadQueue('NEW')" class="tab rounded-xl bg-red-800 px-4 py-2.5 text-sm font-semibold text-white">New</button><button data-status="ASSIGNED" onclick="loadQueue('ASSIGNED')" class="tab rounded-xl px-4 py-2.5 text-sm font-semibold text-slate-500 hover:bg-slate-50">Assigned</button><button data-status="RESOLVED" onclick="loadQueue('RESOLVED')" class="tab rounded-xl px-4 py-2.5 text-sm font-semibold text-slate-500 hover:bg-slate-50">Resolved</button></div>
<div class="mt-4 flex items-center justify-between px-1"><p id="queue-title" class="text-sm font-semibold text-slate-700">New reports</p><button onclick="loadQueue(activeStatus)" class="text-xs font-semibold text-slate-500 hover:text-slate-900">↻ Refresh</button></div><div id="message" class="mt-3 hidden rounded-xl px-4 py-3 text-sm"></div><div id="queue" class="mt-3 space-y-3"></div>
<section class="mt-8"><div class="flex items-center justify-between gap-3"><div><h2 class="text-lg font-bold">Possible duplicates</h2><p class="mt-1 text-xs text-slate-500">Same area and issue type, with similar descriptions. Review before compiling.</p></div><button onclick="findDuplicates()" class="shrink-0 rounded-xl border border-slate-200 bg-white px-3.5 py-2.5 text-xs font-semibold hover:bg-slate-50">Find matches</button></div><div id="duplicate-results" class="mt-3 space-y-3"></div></section>
</main>
<dialog id="category-dialog" class="w-[min(92vw,28rem)] rounded-2xl p-0 shadow-2xl backdrop:bg-slate-900/50"><form method="dialog" class="p-5"><div class="flex items-start justify-between"><div><p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Officer review</p><h2 class="mt-1 text-lg font-bold">Correct category</h2></div><button class="rounded-lg px-2 py-1 text-slate-400 hover:bg-slate-100" aria-label="Close">✕</button></div><p id="cat-ticket" class="mt-2 text-xs text-slate-500"></p><label for="new-category" class="mb-1.5 mt-4 block text-sm font-semibold">Service category</label><select id="new-category" class="w-full rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm"></select><div class="mt-5 flex justify-end gap-2"><button value="cancel" class="rounded-xl border border-slate-200 px-4 py-2.5 text-sm font-semibold">Cancel</button><button id="save-category" value="default" class="rounded-xl bg-slate-900 px-4 py-2.5 text-sm font-semibold text-white">Save correction</button></div></form></dialog>
<dialog id="resolve-dialog" class="w-[min(92vw,28rem)] rounded-2xl p-0 shadow-2xl backdrop:bg-slate-900/50"><form id="resolve-form" class="p-5"><div class="flex items-start justify-between"><div><p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Close report</p><h2 class="mt-1 text-lg font-bold">Mark as resolved</h2></div><button type="button" onclick="closeResolve()" class="rounded-lg px-2 py-1 text-slate-400 hover:bg-slate-100" aria-label="Close">✕</button></div><p id="resolve-ticket" class="mt-2 text-xs text-slate-500"></p><label for="resolve-note" class="mb-1.5 mt-4 block text-sm font-semibold">Resolution note <span class="font-normal text-slate-400">(optional)</span></label><textarea id="resolve-note" rows="3" maxlength="1000" placeholder="Briefly describe what was fixed" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm"></textarea><div id="resolve-error" class="mt-2 hidden rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700"></div><div class="mt-5 flex justify-end gap-2"><button type="button" onclick="closeResolve()" class="rounded-xl border border-slate-200 px-4 py-2.5 text-sm font-semibold">Cancel</button><button id="resolve-submit" class="rounded-xl bg-emerald-700 px-4 py-2.5 text-sm font-semibold text-white">Confirm resolved</button></div></form></dialog>
<script>
let activeStatus='NEW',categoryTicket='',categories=[],items=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function token(){return document.getElementById('token').value}function message(text,type='error'){const el=document.getElementById('message');el.textContent=text;el.className='mt-3 rounded-xl px-4 py-3 text-sm '+(type==='error'?'border border-red-200 bg-red-50 text-red-800':'border border-emerald-200 bg-emerald-50 text-emerald-800')}
function openDashboard(){location.href='/dashboard?token='+encodeURIComponent(token())}
async function loadQueue(status){activeStatus=status;document.querySelectorAll('.tab').forEach(b=>{const on=b.dataset.status===status;b.className='tab rounded-xl px-4 py-2.5 text-sm font-semibold '+(on?'bg-red-800 text-white':'text-slate-500 hover:bg-slate-50')});document.getElementById('queue-title').textContent={NEW:'New reports',ASSIGNED:'Assigned reports',RESOLVED:'Resolved reports'}[status];const q=document.getElementById('queue');q.innerHTML='<div class="rounded-2xl border border-slate-200 bg-white p-8 text-center text-sm text-slate-500">Loading reports…</div>';document.getElementById('message').classList.add('hidden');try{const r=await fetch('/api/queue?status='+status+'&token='+encodeURIComponent(token()));if(r.status===403)throw Error('Access denied. Check the officer token.');if(!r.ok)throw Error('Could not load the queue. Please try again.');items=await r.json();if(!items.length){q.innerHTML=`<div class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-14 text-center"><div class="text-3xl">${status==='RESOLVED'?'✓':'✦'}</div><p class="mt-3 text-sm font-semibold">${status==='RESOLVED'?'No resolved reports yet':'You’re all caught up'}</p><p class="mt-1 text-xs text-slate-500">Reports in this queue will appear here.</p></div>`;return}q.innerHTML=items.map(t=>{const pc=t.priority==='P1'?'bg-red-100 text-red-800':t.priority==='P2'?'bg-amber-100 text-amber-800':'bg-blue-100 text-blue-800';return `<article class="rounded-2xl border border-slate-200/80 bg-white p-4 shadow-sm sm:p-5"><div class="flex flex-wrap items-start justify-between gap-3"><div class="flex flex-wrap items-center gap-2"><span class="font-mono text-sm font-bold">${esc(t.code)}</span><span class="rounded-full px-2.5 py-1 text-[11px] font-bold ${pc}">${esc(t.priority)}</span>${t.category_code?`<span class="rounded-full bg-slate-100 px-2.5 py-1 text-[11px] font-semibold text-slate-600">${esc(t.category_code)}</span>`:'<span class="rounded-full bg-violet-50 px-2.5 py-1 text-[11px] font-semibold text-violet-700">Needs category</span>'}</div><span class="text-xs text-slate-400">${esc((t.created_at||'').replace('T',' ').slice(0,16))}</span></div><p class="mt-3 whitespace-pre-wrap text-sm font-semibold leading-6 text-slate-900">${esc(t.description)}</p><div class="mt-2 flex flex-wrap gap-x-2 gap-y-1 text-xs text-slate-500"><span>${esc(t.zone_code)}</span>${t.asset_code?`<span>· Asset ${esc(t.asset_code)}</span>`:''}${t.symptom?`<span>· ${esc(t.symptom)}</span>`:''}</div><div class="mt-3 flex flex-wrap items-center justify-between gap-3"><div class="flex items-center gap-2 text-xs text-slate-500"><span class="rounded-lg bg-slate-50 px-2.5 py-1.5 font-semibold text-slate-700">AI: ${esc(t.group_code||'—')} · ${Math.round((t.ai_confidence||0)*100)}%</span></div><div class="flex flex-wrap gap-2">${t.status!=='RESOLVED'?`<button onclick="openCategory('${esc(t.code)}')" class="rounded-lg border border-slate-200 px-3 py-2 text-xs font-semibold text-slate-600 hover:border-slate-400">${t.category_code?'Correct category':'Set category'}</button>`:''}${t.status==='NEW'?`<button onclick="act('${esc(t.code)}','claim')" class="rounded-lg bg-[#991b2b] px-3.5 py-2 text-xs font-semibold text-white hover:bg-[#7f1725]">Claim report →</button>`:''}${t.status==='ASSIGNED'?`<button onclick="act('${esc(t.code)}','resolve')" class="rounded-lg bg-emerald-700 px-3.5 py-2 text-xs font-semibold text-white hover:bg-emerald-800">Mark resolved ✓</button>`:''}</div></div>${t.photo_path?`<a href="/uploads/${encodeURIComponent(t.photo_path)}" target="_blank" rel="noopener"><img src="/uploads/${encodeURIComponent(t.photo_path)}" alt="Photo for ${esc(t.code)}" class="mt-4 max-h-64 max-w-full rounded-xl border border-slate-100 object-contain"></a>`:''}</article>`}).join('')}catch(e){q.innerHTML='';message(e.message)}}
async function act(code,action){if(action==='resolve'){openResolve(code);return}const fd=new FormData();fd.append('token',token());try{const r=await fetch(`/api/queue/${encodeURIComponent(code)}/${action}`,{method:'POST',body:fd});if(!r.ok)throw Error(r.status===403?'Access denied. Check the officer token.':'Action could not be completed.');await loadQueue(activeStatus)}catch(e){message(e.message)}}
function openResolve(code){document.getElementById('resolve-ticket').textContent=`Ticket ${code}`;document.getElementById('resolve-note').value='';document.getElementById('resolve-error').classList.add('hidden');document.getElementById('resolve-dialog').showModal()}
function closeResolve(){document.getElementById('resolve-dialog').close()}
document.getElementById('resolve-form').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('resolve-submit'),err=document.getElementById('resolve-error'),code=document.getElementById('resolve-ticket').textContent.replace('Ticket ','');btn.disabled=true;btn.textContent='Saving…';err.classList.add('hidden');const fd=new FormData();fd.append('token',token());fd.append('note',document.getElementById('resolve-note').value.trim());try{const r=await fetch(`/api/queue/${encodeURIComponent(code)}/resolve`,{method:'POST',body:fd});if(!r.ok)throw Error(r.status===403?'Access denied. Check the officer token.':'Could not mark this report resolved.');closeResolve();await loadQueue(activeStatus)}catch(ex){err.textContent=ex.message;err.classList.remove('hidden')}finally{btn.disabled=false;btn.textContent='Confirm resolved'}});
async function openCategory(code){categoryTicket=code;document.getElementById('cat-ticket').textContent=`Ticket ${code} · this correction is saved for future classifier training.`;try{if(!categories.length){const r=await fetch('/api/category-options?token='+encodeURIComponent(token()));if(!r.ok)throw Error('Could not load categories.');categories=await r.json()}const t=items.find(x=>x.code===code);document.getElementById('new-category').innerHTML=categories.map(c=>`<option value="${esc(c.code)}" ${t?.category_code===c.code?'selected':''}>${esc(c.portal_name)} · ${esc(c.group_code)}</option>`).join('');document.getElementById('category-dialog').showModal()}catch(e){message(e.message)}}
async function findDuplicates(){const out=document.getElementById('duplicate-results');out.innerHTML='<div class="rounded-xl bg-white p-4 text-sm text-slate-500">Checking recent tickets…</div>';try{const r=await fetch('/api/duplicates?token='+encodeURIComponent(token()));if(!r.ok)throw Error(r.status===403?'Access denied. Check the officer token.':'Could not find similar reports.');const groups=await r.json();if(!groups.length){out.innerHTML='<div class="rounded-xl border border-dashed border-slate-300 bg-white p-5 text-sm text-slate-500">No likely duplicate groups found in the last 30 days.</div>';return}out.innerHTML=groups.map((g,i)=>`<div class="rounded-2xl border border-amber-200 bg-amber-50/60 p-4"><div class="flex flex-wrap items-center justify-between gap-2"><div><p class="text-sm font-bold">${esc(g.group_code)} · ${esc(g.zone_code)} <span class="font-normal text-slate-500">(${g.tickets.length} reports)</span></p><p class="mt-1 text-xs text-slate-500">Select matching tickets to compile them into one work group.</p></div><button onclick="compileGroup(${i})" class="rounded-lg bg-slate-900 px-3 py-2 text-xs font-semibold text-white">Compile selected</button></div><div class="mt-3 space-y-2">${g.tickets.map(x=>`<label class="flex cursor-pointer gap-3 rounded-xl border border-white bg-white p-3"><input type="checkbox" class="duplicate-choice mt-1 accent-[#991b2b]" value="${esc(x.ticket.code)}" data-group="${i}" checked><span class="min-w-0"><span class="flex flex-wrap items-center gap-2"><span class="font-mono text-xs font-bold">${esc(x.ticket.code)}</span><span class="text-[11px] text-slate-400">${Math.round(x.similarity*100)}% text match</span></span><span class="mt-1 block text-sm">${esc(x.ticket.description)}</span><span class="mt-1 block text-[11px] text-slate-400">${esc(x.ticket.status)} · ${esc((x.ticket.created_at||'').replace('T',' ').slice(0,16))}</span></span></label>`).join('')}</div></div>`).join('');window.duplicateGroups=groups}catch(e){out.innerHTML=`<div class="rounded-xl bg-red-50 p-4 text-sm text-red-700">${esc(e.message)}</div>`}}
async function compileGroup(index){const selected=[...document.querySelectorAll(`.duplicate-choice[data-group="${index}"]:checked`)].map(e=>e.value);if(selected.length<2){message('Select at least two tickets to compile.');return}const fd=new FormData();fd.append('token',token());selected.forEach(code=>fd.append('ticket_codes',code));try{const r=await fetch('/api/compilations',{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw Error(d.detail||'Could not compile these tickets.');message(`Compiled ${d.ticket_count} reports into work group #${d.compilation_id}. Original tickets remain available.`,'success');await findDuplicates();await loadQueue(activeStatus)}catch(e){message(e.message)}}
document.getElementById('save-category').addEventListener('click',async e=>{e.preventDefault();const fd=new FormData();fd.append('token',token());fd.append('new_category',document.getElementById('new-category').value);try{const r=await fetch(`/api/queue/${encodeURIComponent(categoryTicket)}/recategorize`,{method:'POST',body:fd});if(!r.ok)throw Error(r.status===403?'Access denied. Check the officer token.':'Could not save category correction.');document.getElementById('category-dialog').close();await loadQueue(activeStatus)}catch(e){message(e.message)}});
loadQueue('NEW');
</script></body></html>
