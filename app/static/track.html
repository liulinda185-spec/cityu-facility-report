<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Track a facility report · CityU</title><script src="https://cdn.tailwindcss.com"></script><script src="/static/tracker.js" defer></script><style>body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}input:focus{outline:2px solid #b91c1c;outline-offset:1px}</style></head>
<body class="min-h-screen bg-[#f6f5f2] text-slate-900 antialiased"><main class="mx-auto min-h-screen max-w-xl bg-white shadow-xl shadow-slate-900/5 sm:my-8 sm:min-h-0 sm:overflow-hidden sm:rounded-3xl">
<header class="bg-[#8f1725] px-6 py-7 text-white"><a href="/" class="text-xs font-medium text-white/70 hover:text-white">← Facility reports</a><h1 class="mt-3 text-2xl font-bold tracking-tight">Track your report</h1><p class="mt-1 text-sm text-white/75">Enter the ticket code you received when you submitted it.</p></header>
<form id="search" class="border-b border-slate-100 p-5 sm:p-6"><label for="code" class="mb-1.5 block text-sm font-semibold">Ticket code</label><div class="flex gap-2"><input id="code" autocomplete="off" placeholder="FM-2026-000001" class="min-w-0 flex-1 rounded-xl border border-slate-200 px-3.5 py-3 font-mono text-sm uppercase"><button id="find" class="rounded-xl bg-[#991b2b] px-5 py-3 text-sm font-semibold text-white hover:bg-[#7f1725]">Find</button></div><p id="error" role="alert" class="mt-2 hidden text-sm text-red-700"></p></form>
<section id="ticket" class="hidden p-5 sm:p-6"><div class="rounded-2xl border border-slate-100 bg-slate-50 p-4"><div class="flex items-start justify-between gap-3"><div><p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Ticket</p><p id="t-code" class="mt-1 font-mono text-lg font-bold text-[#991b2b]"></p></div><span id="status" class="rounded-full px-3 py-1 text-xs font-bold"></span></div><p id="t-desc" class="mt-4 text-sm leading-6 text-slate-800"></p><p id="t-meta" class="mt-3 text-xs leading-5 text-slate-500"></p></div><div class="mt-7"><h2 class="text-sm font-bold">Report timeline</h2><div id="timeline" class="mt-4"></div></div></section>
<footer class="border-t border-slate-100 px-6 py-4 text-center text-sm"><a href="/" class="font-medium text-[#991b2b] hover:underline">← Submit a new report</a></footer></main>
<script>
const codeEl=document.getElementById('code'),ticketEl=document.getElementById('ticket'),errorEl=document.getElementById('error'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.getElementById('search').addEventListener('submit',e=>{e.preventDefault();loadTicket()});
async function loadTicket(){const code=codeEl.value.trim();if(!code){errorEl.textContent='Enter a ticket code to search.';errorEl.classList.remove('hidden');ticketEl.classList.add('hidden');codeEl.focus();return}const btn=document.getElementById('find');btn.disabled=true;btn.textContent='Finding…';errorEl.classList.add('hidden');ticketEl.classList.add('hidden');try{const r=await fetch('/api/reports/'+encodeURIComponent(code));if(r.status===404)throw Error('We couldn’t find that ticket. Check the code and try again.');if(!r.ok)throw Error('Could not load this report. Please try again.');const d=await r.json(),t=d.ticket;document.getElementById('t-code').textContent=t.code;document.getElementById('t-desc').textContent=t.description;document.getElementById('t-meta').textContent=`${t.zone_code} · ${t.group_code||'Pending review'} · ${t.priority} priority`;const st=document.getElementById('status');st.textContent=t.status;st.className='rounded-full px-3 py-1 text-xs font-bold '+(t.status==='RESOLVED'?'bg-emerald-100 text-emerald-800':t.status==='ASSIGNED'?'bg-amber-100 text-amber-800':'bg-blue-100 text-blue-800');document.getElementById('timeline').innerHTML=d.events.map((ev,i)=>`<div class="relative flex gap-3 pb-5 last:pb-0"><div class="relative flex w-5 shrink-0 justify-center"><span class="z-10 mt-1 h-3 w-3 rounded-full ${i===d.events.length-1?'bg-emerald-500':'bg-slate-300'} ring-4 ring-white"></span>${i<d.events.length-1?'<span class="absolute bottom-0 top-4 w-px bg-slate-200"></span>':''}</div><div class="min-w-0"><p class="text-sm font-semibold">${esc(ev.to_status||ev.note||'Update')}</p><p class="mt-1 text-xs text-slate-500">${esc((ev.created_at||'').replace('T',' ').slice(0,16))}${ev.note&&ev.to_status?' · '+esc(ev.note):''}</p></div></div>`).join('')||'<p class="text-sm text-slate-500">No updates yet.</p>';ticketEl.classList.remove('hidden');history.replaceState(null,'','/track?code='+encodeURIComponent(t.code))}catch(e){errorEl.textContent=e.message;errorEl.classList.remove('hidden')}finally{btn.disabled=false;btn.textContent='Find'}}
const initial=new URLSearchParams(location.search).get('code');if(initial){codeEl.value=initial;loadTicket()}
</script></body></html>
