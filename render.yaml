# Render Blueprint — ONE service.
# The assistant used to be a second Flask service on port 5050; it now runs
# inside the main app at /assistant, so there is a single URL, a single
# database and a single token to manage.
databases:
  - name: cityu-facility-db
    databaseName: cityu_facility
    user: cityu_facility
    plan: free
    region: oregon

services:
  - type: web
    name: cityu-facility-report
    runtime: python
    plan: free
    region: oregon
    rootDir: .
    buildCommand: pip install --prefer-binary -r requirements.txt && python ml/train.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: OFFICER_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: cityu-facility-db
          property: connectionString
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FROM_ADDR
        sync: false
      - key: PILOT_CATCHALL
        sync: false
      # --- assistant / watchtower ---
      # openai + a key turns on chat, ticket tools and model-written briefs.
      # Leave CHAT_BACKEND=mock and the platform still works: the watchtower
      # falls back to its rules, which need no key and no tokens.
      - key: CHAT_BACKEND
        value: openai
      - key: CLASSIFY_BACKEND
        value: local_model
      - key: OPENAI_BASE_URL
        value: https://api.deepseek.com/v1
      - key: OPENAI_MODEL
        value: deepseek-chat
      - key: OPENAI_API_KEY
        sync: false
